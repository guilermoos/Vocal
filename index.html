<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocal - Chamada de Áudio P2P</title>
    
    <!-- PWA Configs -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vocal">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Google Fonts & Google Icons (Material Symbols Rounded) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="background-animation"></div>
    <div class="glow-container">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="card">
        <!-- Seção de Conexão (Setup) -->
        <section id="setup-section" class="view active">
            <header>
                <div class="logo-container">
                    <span class="material-symbols-rounded logo-icon">spatial_audio</span>
                </div>
                <h1>Vocal</h1>
                <p class="subtitle">Chamadas de áudio simples, diretas e seguras.</p>
            </header>
            
            <!-- Painel 1: Menu Principal -->
            <div id="panel-main" class="setup-panel">
                <div class="actions">
                    <button id="btn-go-create" class="btn btn-primary">
                        <span class="material-symbols-rounded">add_circle</span>
                        Criar uma Sala
                    </button>
                    <div class="separator">ou</div>
                    <button id="btn-go-join" class="btn btn-secondary">
                        <span class="material-symbols-rounded">login</span>
                        Entrar com Código
                    </button>
                </div>
            </div>

            <!-- Painel 2: Criar Sala (Nome) -->
            <div id="panel-create" class="setup-panel" style="display: none;">
                <div class="actions">
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">person</span>
                        <input type="text" id="create-name-input" placeholder="Seu nome" maxlength="20">
                    </div>
                    <button id="create-room-btn" class="btn btn-primary" disabled>Criar Sala</button>
                    <button id="btn-back-to-main-from-create" class="btn btn-secondary">
                        <span class="material-symbols-rounded">arrow_back</span>
                        Voltar
                    </button>
                </div>
            </div>

            <!-- Painel 3: Entrar com Código - Passo 1 (Código) -->
            <div id="panel-join-code" class="setup-panel" style="display: none;">
                <div class="actions">
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">key</span>
                        <input type="text" id="room-code-input" placeholder="Código da sala (5 dígitos)" maxlength="5">
                    </div>
                    <button id="join-code-next-btn" class="btn btn-primary" disabled>Avançar</button>
                    <button id="btn-back-to-main-from-join" class="btn btn-secondary">
                        <span class="material-symbols-rounded">arrow_back</span>
                        Voltar
                    </button>
                </div>
            </div>

            <!-- Painel 4: Entrar com Código - Passo 2 (Nome) -->
            <div id="panel-join-name" class="setup-panel" style="display: none;">
                <div class="actions">
                    <p class="panel-info">Código da Sala: <strong id="joining-room-code-display"></strong></p>
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">person</span>
                        <input type="text" id="join-name-input" placeholder="Seu nome" maxlength="20">
                    </div>
                    <button id="join-room-btn" class="btn btn-primary" disabled>Entrar na Sala</button>
                    <button id="btn-back-to-code" class="btn btn-secondary">
                        <span class="material-symbols-rounded">arrow_back</span>
                        Voltar
                    </button>
                </div>
            </div>

            <!-- Painel 5: Entrar via Link (Nome) -->
            <div id="panel-link-join" class="setup-panel" style="display: none;">
                <div class="actions">
                    <p class="panel-info">Entrando na sala: <strong id="link-room-code-display"></strong></p>
                    <div class="input-wrapper">
                        <span class="material-symbols-rounded input-icon">person</span>
                        <input type="text" id="link-name-input" placeholder="Seu nome" maxlength="20">
                    </div>
                    <button id="link-join-confirm-btn" class="btn btn-primary" disabled>Entrar na Sala</button>
                    <button id="btn-cancel-link-join" class="btn btn-secondary">
                        <span class="material-symbols-rounded">arrow_back</span>
                        Voltar ao Menu
                    </button>
                </div>
            </div>
            <p id="error-message" class="error"></p>
        </section>

        <!-- Seção da Chamada -->
        <section id="call-section" class="view">
            <header>
                <div class="call-indicator">
                    <div class="pulse-ring"></div>
                    <span class="material-symbols-rounded header-call-icon">settings_voice</span>
                </div>
                <h1>Em chamada</h1>
            </header>
            
            <div class="room-info">
                <div class="room-info-row">
                    <span>Código da Sala</span>
                    <div class="code-display">
                        <code id="room-id-display"></code>
                        <button id="copy-room-id-btn" class="copy-btn-container" title="Copiar código">
                            <span class="material-symbols-rounded">content_copy</span>
                            <span id="copy-feedback" class="copy-feedback-class">Copiado!</span>
                        </button>
                    </div>
                </div>
                <div class="room-info-row" id="share-link-row">
                    <span>Link de Convite</span>
                    <div class="code-display">
                        <code id="share-link-display"></code>
                        <button id="copy-share-link-btn" class="copy-btn-container" title="Copiar link">
                            <span class="material-symbols-rounded">link</span>
                            <span id="copy-share-feedback" class="copy-feedback-class">Copiado!</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Visualizador Wave Animado -->
            <div class="voice-wave-container">
                <div class="voice-wave" id="voice-wave-bars">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>

            <div id="status" class="status-waiting">
                <p id="status-message">Aguardando outro participante</p>
                <div class="dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <!-- Seção de Participantes da Sala -->
            <div id="participants-section" style="display: none;">
                <div id="participant-count">1 / 8 participantes</div>
                <ul id="participant-list"></ul>
            </div>

            <!-- Controles da Chamada -->
            <div class="call-controls">
                <button id="toggle-mute-btn" class="btn btn-secondary" title="Mutar / Desmutar">
                    <span class="material-symbols-rounded" id="mute-icon">mic</span>
                    <span id="mute-btn-text">Mutar</span>
                </button>
                <button id="hang-up-btn" class="btn btn-hangup" title="Desligar Chamada">
                    <span class="material-symbols-rounded">call_end</span>
                    <span id="hang-up-btn-text">Desligar</span>
                </button>
            </div>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
